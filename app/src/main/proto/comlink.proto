syntax = "proto3";

package com.aarushchaudhary.comlink.proto;

message Envelope {
  // 1 and 2 were sender_id / recipient_id in plain text. Gone: relays now see only the tag.
  reserved 1, 2;
  reserved "sender_id", "recipient_id";
  // AES-256-GCM of the padded payload. Except for PRESENCE, the payload is itself a Double Ratchet
  // message (crypto/DoubleRatchet.kt), so its keys stay hidden from relays.
  bytes ciphertext = 3;
  bytes nonce = 4;
  int64 timestamp = 5;
  string envelope_id = 6;
  int32 ttl = 7;
  // Content types:
  // 0 = MESSAGE (text/ack/read receipt, default)
  // 1 = FILE_HEADER (metadata for file transfer)
  // 2 = FILE_PART (chunk of file data)
  // 3 = PRESENCE (encrypted "I'm here", ttl 1; the only thing that marks a contact online)
  // 4 = FILE_STATUS (which parts of a transfer the receiver holds, or a request for that)
  int32 content_type = 8;
  // 16 bytes that only the sender and recipient can compute: HMAC of their shared key, the
  // direction and the 15-minute window. Changes every window, so relays can't link a chat over time.
  bytes tag = 9;
}

message ContactPayload {
  string device_id = 1;
  string public_key = 2;
  string display_name = 3;
}

message AckMessage {
  string message_id = 1;
  int64 timestamp = 2;
}

// Sent once before file data begins. Encrypted inside Envelope.ciphertext.
message FileHeader {
  string transfer_id = 1;       // UUID linking all parts of this transfer
  string file_name = 2;         // Original filename
  string mime_type = 3;         // e.g. "image/jpeg", "application/pdf", "audio/aac"
  int64  file_size = 4;         // Total file size in bytes
  int32  part_count = 5;        // Number of FILE_PART envelopes to expect
  bytes  thumbnail = 6;         // Optional: low-res JPEG thumbnail (≤ 8 KB for images)
  string message_id = 7;        // The Message ID this file belongs to (for Room DB linking)
}

// One piece of a file transfer. Encrypted inside Envelope.ciphertext.
message FilePart {
  string transfer_id = 1;       // Links back to the FileHeader
  int32  part_index = 2;        // 0-based index of this part
  bytes  data = 3;              // File data payload (≤ 100 KB)
}

// Per-part delivery report for a transfer. Encrypted inside Envelope.ciphertext.
// Receiver -> sender: which parts it holds. Sender -> receiver with request = true: "send me yours".
message FileStatus {
  string transfer_id = 1;
  int32  part_count  = 2;       // 0 = the receiver doesn't know this transfer (no header yet)
  bytes  received    = 3;       // Bitmap: bit i (byte i/8, bit i%8) = part i is held
  bool   complete    = 4;       // All parts held and the file is assembled
  bool   request     = 5;       // Sender asking the receiver to report its status
}
